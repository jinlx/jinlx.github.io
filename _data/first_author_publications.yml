  image: "/images/publications/2026-aged-wildfire-smoke/card.png"
  image_width: "600"
  image_height: "518"
  image_alt: "Diagram showing aged wildfire smoke increasing particles and gases, contributing to cancer and noncancer risks, while GEOS-Chem underestimates exposure and risk."
  summary: "What does wildfire smoke become after several days in the atmosphere? This public-facing guide explains how the mixture changed before reaching Missoula, why ozone did not keep rising with thicker smoke, and which pollutants shaped the health-risk estimates."
  key_points:
    - "Carbon monoxide, PM₂.₅, and measured organic gases increased by roughly 2–8 times."
    - "Ozone leveled off or declined once PM₂.₅ exceeded about 30–40 µg m⁻³."
    - "Particles and hazardous gases dominated different parts of the health-risk estimate."
