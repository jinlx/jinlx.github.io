research_experience:
  - institution: "Rutgers University"
    location: "New Brunswick, NJ"
    role: "Postdoctoral Scholar"
    years: "2026–present"
    note: "with Prof. Xiaomeng Jin"
    contributions:
      - "Integrating satellite, aircraft, and surface observations with atmospheric models to quantify wildfire-smoke impacts on air quality and public health."
      - "Developing satellite-sampled along-plume and cross-plume transect workflows that account for pixel quality, overpass timing, plume geometry, winds, and model sampling."
  - institution: "University of Montana"
    location: "Missoula, MT"
    role: "Graduate Research and Teaching Assistant"
    years: "2019–2025"
    note: "with Profs. Lu Hu and Robert J. Yokelson"
    contributions:
      - "Developed the interface between 3-D GEOS-Chem CTM and 0-D F0AM box model."
      - "Led GEOS-Chem and F0AM simulations with multiple chemical mechanisms under wildfire-targeted observational constraints."
      - "Developed a wildfire-targeted 3-D GEOS-Chem CTM, quantified organic-carbon emission budgets, and assessed air-quality impacts and associated health implications."
  - institution: "University of Washington"
    location: "Seattle, WA"
    role: "Visiting Student"
